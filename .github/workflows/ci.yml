# CI pipeline for oh-my-coharness.
#
# The package is pure ESM with no dependencies (only optional @deepseek-ai/*
# peers that the DeepSeek Harness host supplies), so the static/contract jobs
# need no `npm install` and no package-manager cache: there is no lockfile to key
# one on. Tests are plain `node:test` scripts and need no network.
#
# Coverage shape:
#   * static + contracts run on the two supported Node lines (package.json
#     engines: node >=20) on Ubuntu, plus a Windows lane so path/case/sep
#     regressions surface before a release.
#   * the run-tests runner writes a machine-readable JSON result that is
#     uploaded as an artifact; the dirty-tree gate allows exactly that
#     explicitly listed evidence directory.
#   * packaging runs once (Ubuntu/Node 20): manifest check, licence/provenance
#     check and a real `npm pack` → scratch `npm install` → `require.resolve`
#     via scripts/install-check.mjs. No duplicate packaging matrix.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The workflow only reads this repository.
permissions:
  contents: read

# A newer push to the same ref cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Static checks (`npm run check`, which includes the offline licence/provenance
  # check) plus the node:test contract/integration suites (`npm test`, recorded
  # as machine-readable JSON by scripts/run-tests.mjs).
  static-and-contracts:
    name: Static + contracts (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '20.x'
          - os: ubuntu-latest
            node: '22.x'
          # One Windows lane is enough: it is about path/case/separator and
          # child-process behaviour, not about a second packaging run.
          - os: windows-latest
            node: '22.x'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The benchmark/provenance contracts verify frozen historical
          # baseCommits (e.g. 66de9df), so the default shallow clone is not
          # enough: fetch the full history and tags.
          fetch-depth: 0

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          # No `cache:` on purpose — zero dependencies, no lockfile to hash.

      - name: Report runtime
        run: |
          node --version
          npm --version

      # 0.X is an internal foundation line. A missing `private: true` is exactly
      # how an accidental `npm publish` would happen, so it is asserted on every
      # runtime line before any other check can pass.
      - name: Assert package.json stays private
        run: |
          node -e "const p=require('./package.json'); if (p.private !== true) { console.error('::error::package.json must keep private=true so 0.X is never published'); process.exit(1) } console.log('package.json private=true')"

      - name: Static checks
        run: npm run check

      - name: Licence and vendored provenance
        run: node scripts/license-check.mjs

      - name: Contract and integration tests (JSON recorded)
        run: node scripts/run-tests.mjs --out docs/evidence/v0.9/test-run-${{ matrix.os }}-node${{ matrix.node }}.json

      # The suite list lives in package.json scripts.test, which this lane may not
      # edit; the registration-surface contract is a separate file, so run it here.
      - name: Registration surface (dynamic Cordis registrations)
        run: node test/integration/registration-surface.test.mjs

      - name: Upload test-run result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-run-${{ matrix.os }}-node${{ matrix.node }}
          path: docs/evidence/v0.9/test-run-${{ matrix.os }}-node${{ matrix.node }}.json
          if-no-files-found: warn

      # The only files a test run may leave behind are the machine-readable
      # evidence files written by scripts/run-tests.mjs into the explicitly
      # listed directory. Anything else means the tree is dirty (generated
      # fixtures, caches, accidental edits) and must be fixed at the source.
      - name: Dirty-tree check (test evidence only)
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -z "$dirty" ]; then
            echo "working tree clean after tests"
            exit 0
          fi
          unexpected=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            path="${line:3}"
            case "$path" in
              docs/evidence/v0.9/*) echo "allowed test evidence: $line" ;;
              *) echo "::error::unexpected working-tree change: $line"; unexpected=1 ;;
            esac
          done <<< "$dirty"
          exit "$unexpected"

  # Packaging contract: what `npm publish` would actually ship, checked three
  # ways. First the repository-side manifest/forbidden-path check, then the
  # offline licence/provenance check, then a REAL `npm pack` whose tarball is
  # installed into a scratch project and resolved from an independent consumer
  # anchor (scripts/install-check.mjs; npm publish is never invoked). A real
  # install cannot be claimed by pack-check, and the runner reports
  # `status: blocked` (non-zero) instead of pretending when npm is absent.
  package-and-install:
    name: Package + install tarball (Ubuntu, Node 20.x)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Assert package.json stays private
        run: |
          node -e "const p=require('./package.json'); if (p.private !== true) { console.error('::error::package.json must keep private=true so 0.X is never published'); process.exit(1) } console.log('package.json private=true')"

      - name: Dry-run pack
        run: npm pack --dry-run

      - name: Tarball manifest + forbidden-path check
        run: node scripts/pack-check.mjs

      - name: Licence and vendored provenance
        run: node scripts/license-check.mjs

      - name: Real pack, scratch install and consumer resolution
        run: node scripts/install-check.mjs --json --out "$RUNNER_TEMP/omc-install-check.json"

      - name: Upload install-check result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-check
          path: ${{ runner.temp }}/omc-install-check.json
          if-no-files-found: warn

      # install-check keeps every artifact (tarball, scratch project, npm cache,
      # config and HOME) in a temp directory, so the checkout must stay clean.
      - name: Dirty-tree check (packaging must be isolated)
        shell: bash
        run: |
          set -euo pipefail
          dirty="$(git status --porcelain --untracked-files=all)"
          if [ -n "$dirty" ]; then
            echo "::error::packaging left the checkout dirty:"
            printf '%s\n' "$dirty"
            exit 1
          fi
          echo "working tree clean after packaging checks"

  # PLACEHOLDER — this job does not exercise DeepSeek Harness and must not be
  # read as a passing DSH check. A real DSH runtime smoke test needs a
  # self-hosted runner with DeepSeek Harness installed, configured and
  # authenticated; a bare GitHub-hosted runner has none of that. Until such a
  # runner exists, this job only prints what would be required and exits 0.
  # It runs exclusively on manual dispatch, so it never colours PR results.
  dsh-runtime-smoke:
    name: DSH runtime smoke (placeholder)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Explain that DSH is not exercised here
        run: |
          set -euo pipefail
          cat <<'EOF'
          [placeholder] dsh-runtime-smoke did NOT run any DeepSeek Harness check.
          A real DSH smoke test requires a self-hosted runner with DeepSeek
          Harness installed, a configured model provider, and credentials.
          Nothing was installed and no network access was attempted here.
          Replace this job once a self-hosted DSH runner is available.
          EOF
          echo "::notice title=DSH runtime smoke is a placeholder::No DeepSeek Harness checks ran; a self-hosted runner with DSH is required."
          exit 0
