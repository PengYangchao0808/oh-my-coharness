# Oh My CoHarness — the single bundle layer.
#
# One install, one preset family:
#   1. `oh-my-coharness`            Host row: settings schema, profile RPC,
#      `omc:<id>` subagent providers, `coharness` tool, `/coharness` command,
#      skills, and the startup report.
#   2. `preset-oh-my-coharness`     the Orchestrator + specialist roles + Council
#      (native or external execution per role; see the settings card).
#   3. `oh-my-coharness-profiles`   user-authored named role profiles.
#   4. `agent-preset-registry`      makes this the default preset for new sessions.
#
# The Host row intentionally keeps the id `oh-my-coharness`: a pre-0.4 user
# override of that row keeps targeting the same row after the merge.
#
# Everything below the Host row's `config` is the user-editable surface; see
# docs/PLAN.zh-CN.md §3.5 and docs/MIGRATION.md. The preset list mirrors the
# shipped `standard` preset so this composition keeps the normal coding tools.
# Secrets never go in this patch: point `harnesses.<id>.envFile` at a 0600 file
# outside the profile.

- insert:
    - id: oh-my-coharness
      name: oh-my-coharness
      config:
        surface: auto
        dispatch:
          maxParallel: 4
          defaultMode: read-only
          timeoutMs: 600000
          maxOutputBytes: 20000
        wsl:
          distro: ""
        # Example: enable a harness that needs an endpoint or a key.
        # harnesses:
        #   glm:
        #     enabled: true
        #     envFile: "C:/Users/<you>/.dsh/coharness.env"
        privacy:
          reportBinaryPaths: false

    # The Orchestrator and every specialist role. Execution backends are role
    # configuration, not row wiring: the same subagent_oracle tool runs natively
    # or through omc:<harness> according to role.execution.
    - id: preset-oh-my-coharness
      name: 'oh-my-coharness/preset'

    # Named role profiles, persisted through the host ConfigEditor.
    - id: oh-my-coharness-profiles
      name: 'oh-my-coharness/profile-registry'

# Make Oh My CoHarness the preset a new session starts with. The native Agent
# Preset picker remains authoritative: a user's explicit `selectedDefault`
# (stored by DSH settings) still wins over this bundle default.
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: oh-my-coharness
